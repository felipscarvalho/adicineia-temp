# Arquivos da SPA: assets com hash ficam em cache longo; index.html nunca, para pegar a versão nova.
server {
    listen 3001;
    root /usr/share/nginx/html;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
